# D3F2: D3 on outer fold 2, cross-validation of the base recipe. Prepared, not run.
experiment_id: D3F2
phase: P3
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: D3's gain over L1 (four vs two trainable DINO blocks) holds on outer fold 2
question: >
  With outer fold 2 held out and everything else identical to D3, does D3 beat L1F2?
control: L1F2
changes: [train.unfreeze_blocks]
outer_fold: "2"
folds: state/folds-v2-allgold.csv
labels: {source: public_mean_v1, file: state/soft-labels/public-mean-v1.jsonl,
         sha256: 7d045805be5a8643dc6e1397ad8f71e7875003799a27fd11a05a6d5a9d916e04}
cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: dinov2_vits14, file: dinov2_vits14_pretrain.pth, sha256: configs/dinov2_vits14_allowlist.json}
train:
  profile: campaign
  encoder: dinov2_vits14
  init: official_pretrained
  label_source: public_mean_v1
  pooling: mean
  unfreeze_blocks: 4
  unfreeze_after_epochs: 1
  layer_decay: null
  train_centers_per_slot: 6
  img_size: 224
  epochs: 8
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00001
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
max_full_runs: 1
decision_criterion: >
  CV rule, fixed 2026-10-12 before any fold-1/2 run, shared by D3F1 and D3F2. Folds 1 and 2 hold out
  different weak studies (~870 each); gold is the same 58 studies, scored after training on a
  different study set. The D3 recipe is consistent across outer folds if, in BOTH folds 1 and 2,
  D3Fk - L1Fk has a positive gold_all point delta and a weak delta with ci95 lower bound > 0.
  Otherwise the D3 gain is reported as fold-dependent. Fold-0 results (D3, L1) are not re-used
  as evidence for this rule.
