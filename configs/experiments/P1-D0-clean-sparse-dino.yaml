# P1 / D0. Prepared, not run. No metric exists for this arm.
experiment_id: D0
phase: P1
priority: 1
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: New clean sparse DINO baseline under revised gold exclusion
question: >
  With every weight starting from official self-supervised DINOv2 (no supervised
  warm start that saw other folds) and all 58 gold studies held out of image
  training, what do the sparse six-center two-block recipe's gold and weak AUCs become?
control: null
changes: []
not_a_control: >
  The warm-started two-block run (gold-29 0.7953) differs in initialization and
  gold exclusion; it is a reference only, never a paired control for P1/P2.
folds: state/folds-v2-allgold.csv
labels: {source: hard_masked, file: numeric labels jsonl, sha256: recorded_at_job_build}
cache:
  name: v3-sixcenter-sparse
  storage: npy
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 6
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: dinov2_vits14, file: dinov2_vits14_pretrain.pth, sha256: configs/dinov2_vits14_allowlist.json}
train:
  profile: campaign
  encoder: dinov2_vits14
  init: official_pretrained
  label_source: hard_masked
  pooling: mean
  unfreeze_blocks: 2
  unfreeze_after_epochs: 1   # one frozen head-only epoch, then the last two blocks
  layer_decay: null
  train_centers_per_slot: null
  img_size: 224
  epochs: 8
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00001
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
risk: The head starts untrained; one frozen epoch at lr_head 1e-4 may underfit relative to the warm-started recipe.
max_full_runs: 1
decision_criterion: Establishes the clean P1 control; no promotion decision from this arm alone.
