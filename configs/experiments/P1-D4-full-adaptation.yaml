# P1 / D4. Prepared, not run. No metric exists for this arm.
experiment_id: D4
phase: P1
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: Full DINO adaptation improves over partial fine-tuning
question: Does training every encoder parameter with layer-wise LR decay 0.75 (last block at lr_backbone, stem at 0.75^12) improve over L1's two blocks?
control: L1
rebase_on: >
  Rebased 2026-10-12 from D1 to L1 under the L1S2 pre-registered rule (L1S2 - D1S2 gold_all
  +0.025, ci95 [+0.005, +0.047]). Coverage stays v4 / 6 train centers: no D0-D2 coverage arm
  won, and L1 is the best measured recipe on that cache. Declared changes are unchanged.
changes: [train.unfreeze_blocks, train.layer_decay]
folds: state/folds-v2-allgold.csv
labels: {source: public_mean_v1, file: state/soft-labels/public-mean-v1.jsonl,
         sha256: 7d045805be5a8643dc6e1397ad8f71e7875003799a27fd11a05a6d5a9d916e04}
cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: dinov2_vits14, file: dinov2_vits14_pretrain.pth, sha256: configs/dinov2_vits14_allowlist.json}
train:
  profile: campaign
  encoder: dinov2_vits14
  init: official_pretrained
  label_source: public_mean_v1
  pooling: mean
  unfreeze_blocks: all
  unfreeze_after_epochs: 1
  layer_decay: 0.75
  train_centers_per_slot: 6
  img_size: 224
  epochs: 8
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00001
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
max_full_runs: 1
decision_criterion: Paired gold bootstrap delta vs the control with uncertainty; weak delta must agree in sign.
