# D3ALLE16: D3ALL with 16 epochs (schedule dose-response next to D3ALLE12). Prepared, not run.
experiment_id: D3ALLE16
phase: P3
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: Four trainable blocks keep improving beyond 12 epochs
question: >
  D3E12 beat D3 (+0.019 gold, +0.016 weak), so 8 epochs under-train four blocks. With everything else identical to D3ALL, do 16 epochs improve gold AUC, and by more than 12?
control: D3ALL
changes: [train.epochs]
outer_fold: "none"
folds: state/folds-v2-allgold.csv
labels: {source: public_mean_v1, file: state/soft-labels/public-mean-v1.jsonl,
         sha256: 7d045805be5a8643dc6e1397ad8f71e7875003799a27fd11a05a6d5a9d916e04}
cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: dinov2_vits14, file: dinov2_vits14_pretrain.pth, sha256: configs/dinov2_vits14_allowlist.json}
train:
  profile: campaign
  encoder: dinov2_vits14
  init: official_pretrained
  label_source: public_mean_v1
  pooling: mean
  unfreeze_blocks: 4
  unfreeze_after_epochs: 1
  layer_decay: null
  train_centers_per_slot: 6
  img_size: 224
  epochs: 16
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00001
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
max_full_runs: 1
decision_criterion: >
  Joint selection rule, fixed 2026-10-13 before any of D3ALLE12, D3ALLE16, D3ALLLR2 has run (gold only;
  none has a weak split). A candidate qualifies if its paired gold_all delta vs D3ALL is > 0 with ci95
  lower bound > -0.01. The qualifying candidate with the highest gold_all point estimate becomes the
  submission candidate; on a tie within 0.002, the shorter training wins. If none qualifies, D3ALL
  (public 0.845) stays. Choosing the best of three on 58 gold studies favours a lucky arm, so the
  winner's delta is reported as optimistic. Any submission needs the user's explicit authorization.
