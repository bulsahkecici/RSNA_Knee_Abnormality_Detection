# PLALL: D3ALLLR2 trained on pseudo labels from the 5-fold teachers (pseudo-v1-all). Prepared, not run.
experiment_id: PLALL
phase: P3
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: Pseudo labels improve the all-folds submission recipe
question: >
  Same as D3ALLLR2 except the training targets: 0.5 public-mean-v1 + 0.5 out-of-fold probability from D3LR2 and LR2F1-4. Gold only (no weak split); PL0 carries the weak evidence.
control: D3ALLLR2
changes: [labels, train.label_source]
outer_fold: "none"
folds: state/folds-v2-allgold.csv
labels: {source: pseudo_v1_all, file: state/soft-labels/pseudo-v1-all.jsonl,
         sha256: 660a4b57c06ef16ce50c78d274d805dfafd9e8ecd83d034dd0ac798919df58d7}
cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: dinov2_vits14, file: dinov2_vits14_pretrain.pth, sha256: configs/dinov2_vits14_allowlist.json}
train:
  profile: campaign
  encoder: dinov2_vits14
  init: official_pretrained
  label_source: pseudo_v1_all
  pooling: mean
  unfreeze_blocks: 4
  unfreeze_after_epochs: 1
  layer_decay: null
  train_centers_per_slot: 6
  img_size: 224
  epochs: 8
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00002
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
max_full_runs: 1
decision_criterion: >
  Fixed 2026-10-13 before any teacher ran. Replaces D3ALLLR2 (public 0.862) as the submission candidate
  only if PL0 is supported and PLALL's gold_all delta vs D3ALLLR2 is > 0 with ci95 lower bound > -0.01.
  V5ALLLR2 is not a candidate (V5LR2 failed its rule).
