# D3ALL: the D3 recipe trained on every non-gold study (no weak holdout). Prepared, not run.
experiment_id: D3ALL
phase: P3
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: Training D3 on all folds (no weak holdout) does not hurt and is the next submission candidate
question: >
  D3 held out fold 0 (~870 studies) for weak evaluation. With the recipe confirmed on three outer folds, does training on every non-gold study keep gold AUC at D3's level? Gold stays excluded; there is no weak split.
control: D3
changes: [outer_fold]
outer_fold: "none"
folds: state/folds-v2-allgold.csv
labels: {source: public_mean_v1, file: state/soft-labels/public-mean-v1.jsonl,
         sha256: 7d045805be5a8643dc6e1397ad8f71e7875003799a27fd11a05a6d5a9d916e04}
cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: dinov2_vits14, file: dinov2_vits14_pretrain.pth, sha256: configs/dinov2_vits14_allowlist.json}
train:
  profile: campaign
  encoder: dinov2_vits14
  init: official_pretrained
  label_source: public_mean_v1
  pooling: mean
  unfreeze_blocks: 4
  unfreeze_after_epochs: 1
  layer_decay: null
  train_centers_per_slot: 6
  img_size: 224
  epochs: 8
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00001
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
max_full_runs: 1
decision_criterion: >
  Fixed 2026-10-12 before the run. Non-inferiority on gold only (no weak holdout exists): D3ALL is the
  next submission candidate if its paired gold_all delta vs D3 is >= -0.01. Gold A/B are reported only.
  A submission still needs the user's explicit authorization.
