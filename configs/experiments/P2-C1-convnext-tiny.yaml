# P2 / C1. Prepared, not run. No metric exists for this arm.
experiment_id: C1
phase: P2
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: ConvNeXt-Tiny learns complementary local evidence
question: Does ConvNeXt-Tiny (ImageNet-1k, last 6 of 18 blocks trained = 1/3 of units, matching D3's 4/12) match or complement D3 on identical labels, windows and split?
