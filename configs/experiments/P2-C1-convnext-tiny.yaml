cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: convnext_tiny, file: convnext_tiny.fb_in1k/model.safetensors, sha256: configs/models/convnext_tiny.yaml}
train:
  profile: campaign
  encoder: convnext_tiny
  init: official_pretrained
  label_source: public_mean_v1
  pooling: mean
  unfreeze_blocks: 6
  unfreeze_after_epochs: 1
