# P2 / C2. Prepared, not run. No metric exists for this arm.
experiment_id: C2
phase: P2
priority: 2
status: prepared
queue: docs/research/EXPERIMENT_QUEUE_20261009.csv
hypothesis: CoAtNet-0/1 learns stronger window representations
question: Does CoAtNet-0 (both transformer stages trained, 2/4 stages) learn stronger window features than D3 on identical labels, windows and split?
control: D3
rebase_on: >
  Rebased 2026-10-12 from L1 to D3, the replicated base recipe (D3 - L1 +0.038, D3S2 - L1S2 +0.040).
  Trainable depth is scaled to D3's fraction of encoder units (4/12 = 1/3): CoAtNet-0 2 of 4 stages (both transformer stages); no whole-stage count equals 1/3, and D3/D4 showed deeper adaptation helps then saturates.
changes: [weights, train.encoder, train.unfreeze_blocks]
folds: state/folds-v2-allgold.csv
labels: {source: public_mean_v1, file: state/soft-labels/public-mean-v1.jsonl,
         sha256: 7d045805be5a8643dc6e1397ad8f71e7875003799a27fd11a05a6d5a9d916e04}
cache:
  name: v4-dense-three-series
  storage: npz
  slots: [Sagittal:fluid, Coronal:fluid, Axial:fluid]
  centers: 12
  img_size: 224
  preprocess_hash: from_manifest
weights: {encoder: coatnet_0_rw_224, file: coatnet_0_rw_224.sw_in1k/model.safetensors, sha256: configs/models/coatnet_0_rw_224.yaml}
train:
  profile: campaign
  encoder: coatnet_0_rw_224
  init: official_pretrained
  label_source: public_mean_v1
  pooling: mean
  unfreeze_blocks: 2
  unfreeze_after_epochs: 1
  layer_decay: null
  train_centers_per_slot: 6
  img_size: 224
  epochs: 8
  effective_batch: 8
  microbatch: 1
  seed: 2026
  lr_head: 0.0001
  lr_backbone: 0.00001
evaluation: {windows: all_centers, tta: null, splits: [gold, weak], targets: fixed hard masked labels}
measure: [gold_macro_auc, weak_macro_auc, per_class_auc, epoch_wall_seconds, seconds_per_train_study,
          peak_cuda_memory_bytes, evaluation_seconds, skipped_updates]
max_full_runs: 1
decision_criterion: Paired gold bootstrap delta vs D3 with uncertainty; weak delta must agree in sign. The D3 + this arm probability average is reported descriptively.
